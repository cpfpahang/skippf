<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard CPF | SKIPPF</title>
<meta name="theme-color" content="#0a2a5b">
<link rel="icon" href="../icon-192.png?v=20260907">
<script>
  // Dashboard kini dihoskan dalam Apps Script; hanya pegawai CPF Pahang (tab PENGGUNA SKIPPF) boleh membukanya.
  // Halaman ini tidak mengandungi sebarang data.
  var DASHBOARD_URL = 'https://script.google.com/a/macros/moh.gov.my/s/AKfycbwUemeXt1rVgwcw_M8HsX-hLUxvMtsFEvzdbQYRJTSD5D9_RyDhwpGG-G0LXs48qjVc-g/exec';
  if (DASHBOARD_URL.indexOf('DEPLOYMENT_ID') < 0) location.replace(DASHBOARD_URL);
</script>
<style>
  :root{--navy:#0a2a5b;--red:#d13239;--ink:#172b46;--muted:#5b6c80;--line:#dce5ee;--paper:#f4f7fb}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font:16px/1.6 "Segoe UI",Arial,sans-serif}
  .k{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;position:relative}
  .k:before{content:'';position:absolute;left:30px;top:0;width:90px;height:4px;background:var(--red)}
  img{width:180px;height:auto;display:block;margin-bottom:20px}
  h1{font-size:22px;line-height:1.3;color:var(--navy);margin:0 0 8px}
  p{color:var(--muted);font-size:14px;margin:0 0 20px}
  a.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;border-radius:8px;background:var(--navy);color:#fff;font-weight:650;font-size:14px;text-decoration:none}
  a.back{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;color:var(--navy);font-size:14px;font-weight:600;text-decoration:none}
  a:focus-visible{outline:3px solid #d89b24;outline-offset:3px}
</style>
</head>
<body>
<main class="k">
  <img src="../logo-skippf.png?v=20260907" width="720" height="240" alt="One Stop Centre · SKIPPF">
  <h1>Dashboard CPF perlu log masuk</h1>
  <p>Dashboard Bersepadu CPF Pahang hanya boleh dibuka oleh pegawai Cawangan Penguatkuasa Farmasi Pahang yang log masuk dengan akaun rasmi <strong>@moh.gov.my</strong>.</p>
  <a class="btn" id="go" href="#">Log masuk &amp; buka dashboard <span aria-hidden="true">↗</span></a>
  <a class="back" href="../?home=1"><span aria-hidden="true">←</span>&nbsp;Kembali ke SKIPPF</a>
</main>
<script>document.getElementById('go').href = DASHBOARD_URL;</script>
</body>
</html>
